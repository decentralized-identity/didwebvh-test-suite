[package]
name = "didwebvh-compliance"
version = "0.1.0"
edition = "2021"
description = "Compliance test harness for did:webvh using the didwebvh-rs library"

[[bin]]
name = "test-vectors"
path = "src/main.rs"

[[bin]]
name = "generate-vectors"
path = "src/generate.rs"

[[bin]]
name = "generate-negative-vectors"
path = "src/negative-generator.rs"

[dependencies]
didwebvh-rs = { git = "https://github.com/decentralized-identity/didwebvh-rs", default-features = false }
affinidi-data-integrity = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
serde_jcs = "0.2.0"
similar = "2"
serde_yaml = "0.9"
base58 = "0.2"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
